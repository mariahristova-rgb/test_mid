name: Offline assistant checks
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phase26c_fixture
          POSTGRES_PASSWORD: synthetic-runtime-only
        ports:
          - 55426:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase26c_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
      restore_postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phase26c_fixture
          POSTGRES_PASSWORD: synthetic-runtime-only
        ports:
          - 55427:5432
        options: >-
          --memory 512m --cpus 1
          --health-cmd "pg_isready -U postgres -d phase26c_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: semantic_os/frontend/package-lock.json
      - run: pip install -c semantic_os/backend/requirements.lock -r semantic_os/backend/requirements.txt -r semantic_os/backend/requirements-messaging.txt
      - run: pip install -r semantic_os/backend/requirements-dev.txt
      - run: pip-audit -r semantic_os/backend/requirements.lock --no-deps --disable-pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
      - run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate && terraform test -no-color
        working-directory: semantic_os/deploy/phase26c
      - run: python scripts/check_source.py
      - run: python -m unittest discover -s semantic_os/backend/tests -v
        env:
          PHASE26D_PG_DISPOSABLE: 'true'
          PHASE26D_SOURCE_CONTAINER: ${{ job.services.postgres.id }}
          PHASE26D_RESTORE_CONTAINER: ${{ job.services.restore_postgres.id }}
          PHASE26D_RESTORE_DSN: host=127.0.0.1 port=55427 dbname=phase26c_fixture user=postgres password=synthetic-runtime-only
          PHASE26C_PG_DISPOSABLE: 'true'
          PHASE26C_PG_DSN: host=127.0.0.1 port=55426 dbname=phase26c_fixture user=postgres password=synthetic-runtime-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase26d-fault-receipts
          path: |
            artifacts/phase26d/*.json
            artifacts/phase26e/*.json
          if-no-files-found: warn
      - run: python scripts/evaluate_phase17.py
      - run: npm ci --ignore-scripts
        working-directory: semantic_os/frontend
      - run: npm test && npm run typecheck && npm run lint && npm run build
        working-directory: semantic_os/frontend
      - run: npm audit --audit-level=moderate
        working-directory: semantic_os/frontend
      - run: python scripts/demo_saas.py --output docs/architecture/SAAS_DEMO.json
      - run: python scripts/check_migrations.py --output artifacts/migration.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-verification
          path: |
            artifacts/migration.json
            artifacts/phase17/offline-evaluations.json
            docs/architecture/SAAS_DEMO.json
            semantic_os/frontend/dist
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'
      - name: Full-history secret scan
        run: /tmp/gitleaks-8.24.3/gitleaks detect --redact --no-banner --log-opts="--all --full-history" --report-format=json --report-path=artifacts/gitleaks-full-history.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-history-secret-scan
          path: artifacts/gitleaks-full-history.json
