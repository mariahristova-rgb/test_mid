<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="public-id" content="{{PUBLIC_ID}}"><meta name="parent-origin" content="{{PARENT_ORIGIN}}"><meta name="initial-locale" content="{{LOCALE}}">
<title>Assistant / Асистент</title><link rel="stylesheet" href="/widget/assets/frame.css"><link rel="stylesheet" href="/widget/brand/{{PUBLIC_ID}}.css"><script type="module" src="/widget/assets/frame.js"></script></head>
<body><header><img id="logo" alt="" width="32" height="32" hidden><h1 data-label="assistant"></h1><button id="close" type="button" data-label="close"></button></header>
<main><p id="state" role="status" aria-live="polite"></p><p id="error" role="alert" tabindex="-1"></p>
<label><span data-label="language"></span><select id="locale"><option value="bg-BG">Български</option><option value="en-US">English</option></select></label>
<section id="welcome" hidden><p class="eyebrow" data-concierge="subtitle"></p><h2 data-concierge="welcome"></h2><p data-concierge="intro"></p><p class="timezone">Europe/Sofia</p><div id="quick-actions" class="quick-actions"><button type="button" data-action="booking" data-concierge="booking"></button><button type="button" data-action="explore" data-concierge="explore"></button><button type="button" data-action="information" data-concierge="information"></button><button type="button" data-action="business" data-concierge="business"></button><button type="button" data-action="reschedule" data-concierge="reschedule"></button><button type="button" data-action="cancel" data-concierge="cancel"></button><button type="button" data-action="feature" data-concierge="feature"></button></div></section><section id="workflow" hidden tabindex="-1"></section>
<label><input id="remember" type="checkbox"><span data-label="remember"></span></label>
<label id="analytics-control" hidden><input id="analytics-consent" type="checkbox"><span data-label="analyticsConsent"></span></label>
<div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
<div class="actions"><button id="retry" type="button" hidden data-label="retry"></button><button id="confirm" type="button" hidden data-label="confirm"></button><button id="human" type="button" data-label="human"></button></div>
<details><summary data-label="privacy"></summary><p id="privacy"></p><p id="technical-notice" data-label="mock"></p><label><input id="clear-confirm" type="checkbox"><span data-label="clearWarning"></span></label><button id="clear" type="button" data-label="clear"></button><a href="https://www.ontelyx.tech/privacy" target="_blank" rel="noopener noreferrer" data-label="privacy"></a></details>
</main><form id="composer"><label for="input" data-label="message"></label><textarea id="input" required maxlength="2000" rows="1"></textarea><button id="send" data-label="send"></button></form></body></html>
