name: test-mid-staging
services:
  backend:
    image: test-mid-assistant:phase5-check
    command: [uvicorn, backend.assistant.staging_fixture:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --workers, "1"]
    environment:
      ASSISTANT_ENV: staging
      ASSISTANT_STAGING_FIXTURE: "true"
      ASSISTANT_STAGING_PUBLIC_KEY_FILE: /run/secrets/staging-public.pem
      ASSISTANT_DATABASE: /data/staging.sqlite3
      ASSISTANT_ENCRYPTION_KEY: ${ASSISTANT_ENCRYPTION_KEY:?Required}
      ASSISTANT_BACKUP_ENCRYPTION_KEY: ${ASSISTANT_BACKUP_ENCRYPTION_KEY:?Required}
      ASSISTANT_BACKUP_DIRECTORY: /backups
      ASSISTANT_BACKUP_ENABLED: "true"
      ASSISTANT_BACKUP_INTERVAL_SECONDS: "3600"
      ASSISTANT_ALLOW_MOCK_BILLING: "true"
      ASSISTANT_ENABLE_LIVE_VOICE: "false"
      ASSISTANT_ENABLE_LIVE_MESSAGING: "false"
      ASSISTANT_MESSAGING_WORKER_ENABLED: "true"
      ASSISTANT_UI_ORIGIN: https://127.0.0.1:8443
    volumes:
      - staging-data:/data
      - staging-backups:/backups
      - ${STAGING_ARTIFACT_DIRECTORY:?Required}/staging-public.pem:/run/secrets/staging-public.pem:ro
  frontend:
    image: test-mid-frontend:phase5-staging
    depends_on:
      backend:
        condition: service_healthy
  edge:
    image: nginxinc/nginx-unprivileged:stable-alpine
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx-staging.conf:/etc/nginx/nginx.conf:ro
      - ${STAGING_ARTIFACT_DIRECTORY}/staging.crt:/run/secrets/staging.crt:ro
      - ${STAGING_ARTIFACT_DIRECTORY}/staging.key:/run/secrets/staging.key:ro
    depends_on: [frontend]
volumes:
  staging-data:
  staging-backups:
