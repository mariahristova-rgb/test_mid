limit_req_zone $server_name zone=global_demo:1m rate=2r/s;
server {
  listen 8080;
  server_name _;
  client_max_body_size 64k;
  limit_req zone=global_demo burst=20 nodelay;
  location = / { default_type application/json; return 200 '{"service":"Ontelyx assistant staging","scope":"public-widget-only","live_operations":false,"voice":false}'; }
  location ^~ /widget/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 15s;
  }
  location / { return 404; }
  access_log off;
}
server {
  listen 8081;
  server_name _;
  root /site;
  index index.html;
  limit_req zone=global_demo burst=20 nodelay;
  location = /public-state.json { return 404; }
  location / { try_files $uri $uri/ =404; }
  access_log off;
}
